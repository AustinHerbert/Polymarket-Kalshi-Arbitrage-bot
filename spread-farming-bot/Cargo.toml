[package]
name = "spread-farming-bot"
version = "0.1.0"
edition = "2021"
description = "Polymarket spread farming / market making bot for crypto prediction markets"
license = "MIT OR Apache-2.0"

[dependencies]
# Shared market client library
shared-market-client = { path = "../shared-market-client" }

# Core dependencies
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
reqwest = { version = "0.11", features = ["json"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time and async utilities
chrono = "0.4"

# Data structures
dashmap = "6.0"  # Concurrent HashMap for order tracking

[[bin]]
name = "spread-farming-bot"
path = "src/main.rs"

[[bin]]
name = "test-orderbooks"
path = "src/bin/test_orderbooks.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
