[package]
name = "shared-market-client"
version = "0.1.0"
edition = "2021"
description = "Shared Polymarket and Kalshi API clients for trading bots"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
ethers = { version = "2.0", features = ["legacy"] }
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tiny-keccak = { version = "2.0", features = ["keccak"] }
governor = "0.6"
nonzero_ext = "0.3"
