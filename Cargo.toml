[workspace]
resolver = "2"
members = [
    "core",
    "bots/arb-bot",
    "bots/spread-bot",
    "dashboard",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AustinHerbert/Polymarket-Kalshi-Arbitrage-bot"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"

# HTTP & WebSocket
reqwest = { version = "0.11", features = ["json", "blocking"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Crypto / Signing
ethers = { version = "2.0", features = ["legacy"] }
hmac = "0.12"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
pkcs1 = { version = "0.7", features = ["pem"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }

# Utilities
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
dotenvy = "0.15"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Performance
rustc-hash = "2.0"
governor = "0.6"
nonzero_ext = "0.3"
arrayvec = "0.7"
wide = "0.7"

# Internal crates
trading-core = { path = "core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
